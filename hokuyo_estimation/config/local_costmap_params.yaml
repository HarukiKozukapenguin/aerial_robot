local_costmap:
  global_frame: world
  robot_base_frame: multirotor/root
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.05
  observation_sources: scan  # scanセンサーを観察ソースとして指定

scan:
  sensor_frame: laser_frame
  data_type: LaserScan
  topic: /multirotor/scan
  marking: true
  clearing: true
